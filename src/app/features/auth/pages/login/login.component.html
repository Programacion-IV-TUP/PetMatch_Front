<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">PetMatch</h1>
            <p class="text-sm text-gray-600 mt-2">
                {{ 'AUTH.LOGIN_SUBTITLE' | transloco }}
            </p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ 'AUTH.EMAIL' | transloco }}
                </label>
                <input id="email" type="email" pInputText formControlName="email" placeholder="usuario@ejemplo.com"
                    class="w-full p-inputtext-sm" />
                @if (isFieldInvalid('email')) {
                <small class="text-red-500 text-xs mt-1 block">
                    {{ 'AUTH.EMAIL_REQUIRED' | transloco }}
                </small>
                }
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ 'AUTH.PASSWORD' | transloco }}
                </label>
                <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true"
                    styleClass="w-full" inputStyleClass="w-full p-inputtext-sm"></p-password>
                @if (isFieldInvalid('password')) {
                <small class="text-red-500 text-xs mt-1 block">
                    {{ 'AUTH.PASSWORD_REQUIRED' | transloco }}
                </small>
                }
            </div>

            <!-- Submit Button -->
            <p-button type="submit" [disabled]="loginForm.invalid || isLoading()"
                styleClass="w-full p-button-primary mt-2"
                [label]="isLoading() ? ('AUTH.SUBMITTING_LOGIN' | transloco) : ('AUTH.SUBMIT_LOGIN' | transloco)"></p-button>

        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            {{ 'AUTH.NO_ACCOUNT' | transloco }}
            <a routerLink="/auth/register" class="text-blue-600 font-semibold hover:underline">
                {{ 'AUTH.REGISTER_LINK' | transloco }}
            </a>
        </div>

    </div>
</div>
