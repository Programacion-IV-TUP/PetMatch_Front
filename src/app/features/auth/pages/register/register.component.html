<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">PetMatch</h1>
            <p class="text-sm text-gray-600 mt-2">
                {{ 'AUTH.REGISTER_SUBTITLE' | transloco }}
            </p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

            <!-- First Name -->
            <div>
                <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ 'AUTH.FIRST_NAME' | transloco }}
                </label>
                <input id="first_name" type="text" pInputText formControlName="first_name" placeholder="Juan"
                    class="w-full p-inputtext-sm" />
            </div>

            <!-- Last Name -->
            <div>
                <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ 'AUTH.LAST_NAME' | transloco }}
                </label>
                <input id="last_name" type="text" pInputText formControlName="last_name" placeholder="Pérez"
                    class="w-full p-inputtext-sm" />
            </div>

            <!-- Email Address -->
            <div>
                <label for="email_address" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ 'AUTH.EMAIL' | transloco }}
                </label>
                <input id="email_address" type="email" pInputText formControlName="email_address"
                    placeholder="usuario@ejemplo.com" class="w-full p-inputtext-sm" />
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ 'AUTH.PASSWORD' | transloco }}
                </label>
                <p-password id="password" formControlName="password" [toggleMask]="true" styleClass="w-full"
                    inputStyleClass="w-full p-inputtext-sm"></p-password>
            </div>

            <!-- Password Confirm -->
            <div>
                <label for="password_confirmation" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ 'AUTH.CONFIRM_PASSWORD' | transloco }}
                </label>
                <p-password id="password_confirmation" formControlName="password_confirmation" [feedback]="false"
                    [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full p-inputtext-sm"></p-password>
            </div>

            <!-- Submit Button -->
            <p-button type="submit" [disabled]="registerForm.invalid || isLoading"
                styleClass="w-full p-button-primary mt-2"
                [label]="isLoading ? ('AUTH.SUBMITTING_REGISTER' | transloco) : ('AUTH.SUBMIT_REGISTER' | transloco)"></p-button>

        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            {{ 'AUTH.ALREADY_HAVE_ACCOUNT' | transloco }}
            <a routerLink="/auth/login" class="text-blue-600 font-semibold hover:underline">
                {{ 'AUTH.LOGIN_LINK' | transloco }}
            </a>
        </div>

    </div>
</div>
